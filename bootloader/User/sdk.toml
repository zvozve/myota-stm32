# SDK 拉取配置（BL 工程接入 mysdk-stm32）
# 仅 sdk 一项需填真实路径；换 SDK 目录改这一行即可，其余不变。
# 用法: python sdk_run.py pull   （同步生成 MySDK/）

sdk       = "C:/Container/Library/SDK-STM32/mysdk-stm32"
dest      = "../MySDK"            # 相对 User/ 上溯到工程根；根 CMakeLists 以 add_subdirectory(MySDK) 接入
board_cfg = "board_cfg.h"         # 相对 User/；BL 无板外绑定，见本文件同目录的 board_cfg.h

[modules]
# ---- chip：MCU 片上外设 OOP 封装 ----
"chip.oop_flash" = true   # 内部 Flash（校验读回 / MOVE 搬运 / 安全闸）
"chip.oop_boot"  = true   # 启动跳转（向量表校验 / VTOR / MSP / 软复位）
"chip.platform"  = true   # HAL 统一入口（系列宏）

# ---- middleware ----
"middleware.SEGGER_RTT" = true   # RTT 日志（BL 不联网，调试全靠它；裸机时基走 board_cfg.h 的 BOARD_USE_RTOS=0）

# ---- services：OTA 升级链路（BL 侧） ----
"services.ota_core"   = true   # 共用底座（分区表 / 状态区 / 包格式 / 介质 / 流程）
"services.bootloader" = true   # BL 外壳（读状态 → 生效 → 试运行/回滚 → 校验 → 跳转）
